
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - SafeHer AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:#05071a;
            font-family:Arial, Helvetica, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        /* Main desktop-style card */
        .app-shell{
            width:min(1100px, 100%);
            height:min(92vh, 900px);
            background:#0f1228;
            border:1px solid rgba(255,255,255,.08);
            border-radius:28px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow:0 20px 60px rgba(0,0,0,.45);
        }

        /* Header */
        .header{
            display:flex;
            align-items:center;
            gap:16px;
            padding:22px 28px;
            border-bottom:1px solid rgba(255,255,255,.08);
            background:rgba(255,255,255,.02);
        }

        .header img{
            width:52px;
            height:52px;
            border-radius:14px;
            object-fit:cover;
        }

        .header h1{
            color:#fff;
            font-size:1.9rem;
            margin-bottom:4px;
        }

        .header p{
            color:#aab0d6;
            font-size:.95rem;
        }

        /* Chat area */
        .chat-box{
            flex:1;
            overflow-y:auto;
            padding:26px;
            display:flex;
            flex-direction:column;
            gap:18px;
            background:linear-gradient(180deg,#11142d 0%, #0f1228 100%);
        }

        .message{
            display:flex;
            width:100%;
        }

        .message.ai{
            justify-content:flex-start;
        }

        .message.user{
            justify-content:flex-end;
        }

        .bubble{
            max-width:72%;
            padding:16px 18px;
            border-radius:20px;
            line-height:1.5;
            white-space:pre-line;
            font-size:15px;
        }

        .message.ai .bubble{
            background:#232742;
            color:#fff;
            border-top-left-radius:8px;
        }

        .message.user .bubble{
            background:linear-gradient(135deg,#7c5cff,#5b7cff);
            color:#fff;
            border-top-right-radius:8px;
        }

        /* Input area */
        .input-bar{
            border-top:1px solid rgba(255,255,255,.08);
            padding:18px 24px;
            background:#0f1228;
        }

        .input-row{
            display:flex;
            align-items:center;
            gap:14px;
        }

        #userMessage{
            flex:1;
            height:54px;
            padding:0 18px;
            border-radius:16px;
            border:1px solid rgba(255,255,255,.12);
            background:#171b35;
            color:#fff;
            font-size:16px;
            outline:none;
        }

        #userMessage::placeholder{
            color:#9aa1c7;
        }

        .btn{
            height:54px;
            border:none;
            border-radius:16px;
            cursor:pointer;
            transition:.2s ease;
            font-weight:600;
        }

        .btn:hover{
            transform:translateY(-1px);
        }

        .btn-mic{
            width:54px;
            background:#3b82f6;
            color:#fff;
            font-size:20px;
        }

        .btn-send{
            padding:0 24px;
            background:#ff6b6b;
            color:#fff;
            min-width:120px;
        }

        .footer-actions{
            margin-top:14px;
            display:flex;
            justify-content:flex-end;
        }

        .btn-back{
            background:#232742;
            color:#fff;
            padding:12px 18px;
            text-decoration:none;
            border-radius:12px;
            font-size:14px;
        }

        /* Mobile */
        @media (max-width:768px){
            body{
                padding:10px;
            }

            .app-shell{
                height:95vh;
                border-radius:22px;
            }

            .header{
                padding:18px 20px;
            }

            .header h1{
                font-size:1.5rem;
            }

            .chat-box{
                padding:18px;
            }

            .bubble{
                max-width:88%;
                font-size:14px;
            }

            .input-row{
                gap:10px;
            }

            #userMessage{
                height:50px;
                font-size:15px;
            }

            .btn{
                height:50px;
            }

            .btn-send{
                min-width:88px;
                padding:0 16px;
            }
        }
    </style>
</head>

<body>

    <div class="app-shell">

        <div class="header">
            <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="SafeHer Logo">

            <div>
                <h1>SafeHer AI</h1>
                <p>AI Safety Assistant</p>
            </div>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="message ai">
                <div class="bubble">
👋 Hi! I’m SafeHer AI.

How can I help you stay safe today?
                </div>
            </div>

        </div>

        <div class="input-bar">

            <div class="input-row">

                <input type="text"
                       id="userMessage"
                       placeholder="Ask something or click the mic to speak..."
                       onkeydown="if(event.key==='Enter') sendMessage()">

                <button type="button"
                        id="micBtn"
                        onclick="startVoiceInput()"
                        class="btn btn-mic"
                        title="Speak">🎤</button>

                <button onclick="sendMessage()"
                        class="btn btn-send">Send</button>

            </div>

            <div class="footer-actions">
                <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
            </div>

        </div>

    </div>

    <script>
        // 💬 Send Message with Real Gemini API (Backend Call)
        function sendMessage() {

            let userInput = document.getElementById("userMessage");
            let message = userInput.value.trim();

            if (message === "") return;

            let chat = document.getElementById("chatBox");

            // User message
            chat.innerHTML += `
                <div class="message user">
                    <div class="bubble">${message}</div>
                </div>
            `;

            userInput.value = "";
            chat.scrollTop = chat.scrollHeight;

            // Loading message
            let loadingId = "loading-" + Date.now();

            chat.innerHTML += `
                <div class="message ai">
                    <div class="bubble" id="${loadingId}">🤖 Thinking...</div>
                </div>
            `;

            chat.scrollTop = chat.scrollHeight;

            // Emergency word check
            let lowerMsg = message.toLowerCase();

            if (lowerMsg.includes("unsafe") ||
                lowerMsg.includes("help") ||
                lowerMsg.includes("danger") ||
                lowerMsg.includes("sos")) {

                setTimeout(function () {
                    alert("🚨 Safety Mode Activated!\\n\\nEmergency contacts will be notified.");
                    startSmartCountdown();
                }, 500);
            }

            // Backend call
            let formData = new FormData();
            formData.append("question", message);

            fetch("/ai_assistant", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                let loadingEl = document.getElementById(loadingId);

                if (loadingEl) {
                    loadingEl.innerText = data.response;
                }

                chat.scrollTop = chat.scrollHeight;
            })
            .catch(error => {
                console.error("Error:", error);

                let loadingEl = document.getElementById(loadingId);

                if (loadingEl) {
                    loadingEl.innerText = "Connection error. Please try again.";
                }
            });
        }

        // 🎙️ Voice Input Function
        function startVoiceInput() {

            const micBtn = document.getElementById("micBtn");
            const queryBox = document.getElementById("userMessage");

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Voice Recognition is not supported in this browser. Please use Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();

            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onstart = function () {
                micBtn.style.backgroundColor = "#ef4444";
                micBtn.innerText = "🎙️";
            };

            recognition.onresult = function (event) {
                const transcript = event.results[0][0].transcript;
                queryBox.value = transcript;
                sendMessage();
            };

            recognition.onerror = function (event) {
                console.log("Voice error:", event.error);
            };

            recognition.onend = function () {
                micBtn.style.backgroundColor = "";
                micBtn.innerText = "🎤";
            };

            recognition.start();
        }

        // 🚨 Smart Emergency Countdown
        function startSmartCountdown() {

            getCurrentLocation();

            let time = 10;

            let timer = setInterval(function () {

                console.log("Emergency action in " + time + " seconds");

                time--;

                if (time < 0) {
                    clearInterval(timer);
                    alert("🚨 Emergency Alert Sent!");
                }

            }, 1000);
        }

        function getCurrentLocation() {

            if (navigator.geolocation) {

                navigator.geolocation.getCurrentPosition(function (position) {

                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;

                    console.log("Location:", lat, lon);
                });
            }
        }
    </script>

</body>
</html>
