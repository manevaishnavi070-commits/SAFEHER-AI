<!DOCTYPE html>
<html>
<head>

    <title>Settings - SafeHer AI</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="settings-container">

    <div class="brand">

        <img src="{{ url_for('static', filename='images/logo.jpeg') }}">

        <h1>SafeHer AI</h1>

    </div>

    <h2>⚙️ Settings</h2>

    <div class="feature-container">

        <!-- Account -->

        <div class="feature-card">

            <h3>👤 Account</h3>

            <p>Manage profile, email and password.</p>

            <a href="{{ url_for('account_settings') }}">
                <button>Manage Account</button>
            </a>

        </div>

        <!-- Notification -->

        <div class="feature-card">

            <h3>🔔 Notifications</h3>

            <p>Control SOS, AI alerts and Location.</p>

            <a href="{{ url_for('notification_settings') }}">
                <button>Notification Settings</button>
            </a>

        </div>

        <!-- Privacy -->

        <div class="feature-card">

            <h3>🔒 Privacy</h3>

            <p>Manage your personal safety data.</p>

            <a href="{{ url_for('privacy') }}">
            <button>Privacy Settings</button>
            </a>


        </div>

        <!-- Theme -->

        <div class="feature-card">

            <h3>🎨 Theme</h3>

            <p>Dark Mode Enabled.</p>

            <a href="{{ url_for('theme') }}">
            <button>Theme setting</button>
            </a>

        </div>

        <!-- About -->

        <div class="feature-card">

            <h3>ℹ️ About SafeHer AI</h3>

            <p>Version 1.0</p>

            <a href="{{ url_for('about') }}">
            <button>Latest Version</button>
            </a>

        </div>

        <!-- Help -->

        <div class="feature-card">

            <h3>📞 Help & Support</h3>

            <p>Need any help?</p>

            <a href="{{ url_for('support') }}">
            <button>Support</button>
            </a>

        </div>

    </div>

    <br>

    <a href="{{ url_for('dashboard') }}">

        <button>
            ⬅ Back To Dashboard
        </button>

    </a>

</div>

</body>
</html>
