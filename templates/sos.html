<!DOCTYPE html>
<html>

<head>
    <title>SafeHer AI - SOS Emergency</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body onload="getLocation()">

    <div class="sos-page">

        <div class="sos-box">

            <img src="{{ url_for('static', filename='images/logo.png') }}"
                alt="SafeHer AI Logo">

            <h1>Emergency SOS</h1>

            <p>Press the button only in an emergency situation.</p>

            <!-- Manual SOS -->
            <form id="sosForm" action="/send_sos" method="POST">
                <button type="submit" class="big-sos">
                    🚨 SOS
                </button>
            </form>

            <br>

            <!-- Voice SOS -->
            <button type="button" onclick="startVoiceSOS()">
                🎤 Voice SOS
            </button>

            <p id="voiceStatus"></p>

            <p id="countdown"></p>

            <p id="location"></p>

            <div class="status">
                <p>Your emergency contacts will be notified.</p>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
